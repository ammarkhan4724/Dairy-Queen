<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#0B1E38"/>
    </linearGradient>
    <linearGradient id="logoGoldCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="logoCreamSwirl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="logoRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4002B"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Left Icon Emblem Badge -->
  <g transform="translate(4, 4)">
    <rect width="56" height="56" rx="16" fill="url(#logoBgGrad)"/>
    <rect x="2" y="2" width="52" height="52" rx="14" fill="none" stroke="url(#logoGoldCrown)" stroke-width="1.2" stroke-opacity="0.7"/>

    <!-- Emblem Detail -->
    <g transform="scale(0.875) translate(4, 3)" filter="url(#logoShadow)">
      <!-- Red Ribbon -->
      <path d="M16 46 Q32 49 48 46 L46 41 Q32 43 18 41 Z" fill="url(#logoRed)"/>
      <circle cx="23" cy="44" r="1.3" fill="#FFE066"/>
      <circle cx="32" cy="45" r="1.6" fill="#FFE066"/>
      <circle cx="41" cy="44" r="1.3" fill="#FFE066"/>

      <!-- Crown Body -->
      <path d="M18 41 L20 28 L27 34 L32 20 L37 34 L44 28 L46 41 Q32 44 18 41 Z" fill="url(#logoGoldCrown)"/>
      
      <!-- Soft Serve Swirl -->
      <path d="M24 38 Q32 35 40 38 Q37 30 32 26 Q27 30 24 38 Z" fill="url(#logoCreamSwirl)"/>
      <path d="M26 31 Q32 27 38 31 Q36 23 32 20 Q28 23 26 31 Z" fill="#FFFFFF"/>
      
      <!-- Top Curl -->
      <path d="M32 21 Q30 15 34 11 Q37 8 36 6 Q34 7 32 10 Q28 14 30 19 Z" fill="url(#logoCreamSwirl)"/>
      <circle cx="36" cy="6" r="1.3" fill="#FFFBEB"/>

      <!-- Jewels -->
      <circle cx="20" cy="27" r="1.8" fill="#FFE066"/>
      <circle cx="44" cy="27" r="1.8" fill="#FFE066"/>
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(70, 0)">
    <!-- "QUEEN DAIRY" -->
    <text x="0" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" fill="#0B1E38" letter-spacing="-0.02em">
      QUEEN DAIRY
    </text>
    
    <!-- "MENU" in vibrant Teal -->
    <text x="144" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" fill="#0E7490" letter-spacing="-0.02em">
      MENU
    </text>
    
    <!-- Subtitle Pill / Tagline -->
    <rect x="0" y="40" width="170" height="15" rx="4" fill="#FEF2F2" stroke="#FEE2E2" stroke-width="1"/>
    <text x="6" y="51" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#E4002B" letter-spacing="0.06em">
      ★ 2026 PRICE &amp; FLAVOR GUIDE
    </text>
  </g>
</svg>
